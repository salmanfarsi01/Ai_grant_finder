version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-stepo_db}
      - POSTGRES_USER=${DB_USER:-stepo_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-stepo_password}
    ports:
      - "5433:5432"
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:2323"
    volumes:
      - .:/app
    ports:
      - "2323:2323"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
